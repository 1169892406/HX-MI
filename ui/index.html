<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HX-MI · 小米设备接入</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <!-- 全局提示条：保存结果 / 失败原因 / 需要行动的提示（可带操作按钮） -->
  <div id="banner" class="banner" hidden></div>

  <!-- 页头：返回按钮必须由本页渲染（宿主 iframe 是 opaque origin，
       只有它能调 plugin.ui.close）。一直显示，不做 hover-only。 -->
  <header class="pagehd">
    <div class="brand"><h1>HX-MI · 小米设备接入</h1></div>
    <span class="spacer"></span>
    <button type="button" id="btn-back" class="btn btn--ghost">← 返回插件列表</button>
  </header>

  <!-- ── ① 已授权账号 ────────────────────────────────────────-->
  <section class="sec">
    <div class="sec__hd">
      <h2>已授权账号</h2>
      <span class="spacer"></span>
      <button type="button" id="btn-reload-accounts" class="btn btn--sm">刷新</button>
      <button type="button" id="btn-add" class="btn btn--primary">＋ 添加账号</button>
    </div>
    <div class="card">
      <div id="accounts" class="accounts"><p class="muted">读取中…</p></div>

      <!-- Token 自动续期（全插件共享配置；账号行内的开关与这里是同一份状态）。
           2026-11-20 用户裁定：说明性小字与风险清单删除（页面小字太多、多为
           重复）—— 开关 title 保留一句「全插件共享设置」。 -->
      <div class="tokenrow">
        <div class="row__main">
          <b>Token 自动续期</b>
        </div>
        <label class="sw" title="保存账号密码，Token 过期时自动重新登录（全插件共享设置）">
          <input type="checkbox" id="f-save-password" checked>
          <span class="sw__ui"></span>
        </label>
      </div>
    </div>

    <!-- 登录表单：点「添加账号」或某行「重新授权」展开 -->
    <div id="login-form" class="card" hidden>
      <div class="form">
        <div class="form__hd">登录小米账号</div>
        <!-- 两种登录方式并排（2026-11-21 用户：「添加账号后弹出来并排放」） -->
        <div class="seg" id="login-seg">
          <button type="button" class="seg__btn seg__btn--on" data-mode="pass">账号密码</button>
          <button type="button" class="seg__btn" data-mode="qr">扫码登录</button>
        </div>

        <div id="login-pane-pass">
          <label class="fld">
            <span>账号（手机号 / 邮箱 / 账号 ID）</span>
            <input type="text" id="f-user" autocomplete="username" placeholder="手机号 或 账号 ID">
          </label>
          <label class="fld">
            <span>密码</span>
            <input type="password" id="f-pass" autocomplete="current-password" placeholder="小米账号密码">
          </label>
          <label class="fld">
            <span>区域</span>
            <select id="f-region">
              <option value="cn">中国大陆</option>
            </select>
          </label>
        </div>

        <div id="login-pane-qr" hidden>
          <div class="qrbox">
            <div id="qr-img" class="qrbox__img muted small">点「生成二维码」后，用手机上的小米商城 / 米家 App 扫码确认登录</div>
            <div class="qrbox__side">
              <button type="button" id="btn-qr-start" class="btn btn--primary btn--sm">生成二维码</button>
              <button type="button" id="btn-qr-cancel" class="btn btn--sm" hidden>取消</button>
              <p id="qr-state" class="muted small">未开始</p>
            </div>
          </div>
        </div>

        <div class="form__act">
          <button type="button" id="btn-login" class="btn btn--primary">登录</button>
          <button type="button" id="btn-cancel-login" class="btn">取消</button>
          <span class="spacer"></span>
          <!-- 退出登录 = 清当前登录会话（非删除账号）。语义与「解绑」不同，入口保留。 -->
          <button type="button" id="btn-logout-session" class="btn btn--sm">退出当前登录会话</button>
        </div>
        <p id="login-hint" class="muted small" hidden></p>
      </div>
    </div>

    <!-- 验证码 / 二次验证 -->
    <div id="challenge" class="card" hidden>
      <div class="form">
        <div class="form__hd" id="ch-title">完成验证</div>
        <label class="fld">
          <span id="ch-label">验证码</span>
          <input type="text" id="f-code" inputmode="numeric" placeholder="输入验证码">
        </label>
        <p id="ch-desc" class="muted small"></p>
        <label class="fld" id="ch-web-row" hidden>
          <span>验证链接（按提示在浏览器完成验证后，把跳转到的 URL 粘贴到这里）</span>
          <input type="text" id="f-web" placeholder="https://sts.api.io.mi.com/sts?...">
        </label>
        <div class="form__act">
          <button type="button" id="btn-verify" class="btn btn--primary">提交验证</button>
          <button type="button" id="btn-verify-web" class="btn" hidden>用链接验证</button>
        </div>
        <div class="form__act">
          <img id="ch-img" alt="验证码图片" hidden style="max-width:220px;border-radius:8px">
        </div>
      </div>
    </div>
  </section>

  <!-- ── ② 控制通道 ──────────────────────────────────────────-->
  <section class="sec">
    <div class="sec__hd"><h2>控制通道</h2></div>
    <div class="card">
      <div class="pick2">
        <label class="pk">
          <input type="radio" name="lan-priority" value="lan" checked>
          <span class="pk__body">
            <span class="pk__t">LAN 局域网直连 <em class="pk__def">推荐</em></span>
            <span class="pk__d">优先使用局域网连接，速度更快更稳定</span>
          </span>
        </label>
        <label class="pk">
          <input type="radio" name="lan-priority" value="cloud">
          <span class="pk__body">
            <span class="pk__t">云端转发</span>
            <span class="pk__d">在局域网不可用时，使用云端服务器进行连接</span>
          </span>
        </label>
      </div>

      <div class="ctrl-row">
        <div class="row__main">
          <b>局域网健康检查</b>
          <p class="muted small">定期检测局域网连接状态，异常时自动切换云端。</p>
        </div>
        <label class="sw sw--locked" title="健康检查常开（内置能力），通过检测间隔调节频率">
          <input type="checkbox" id="f-lan-check-lock" checked disabled>
          <span class="sw__ui"></span>
        </label>
        <span class="ival">检测间隔
          <input type="number" id="f-lan-interval" min="5" max="3600" step="1" value="5" aria-label="检测间隔（秒）">
          秒
        </span>
      </div>
      <div id="lan-status" class="lanstat lanstat--none">⏳ 正在检测局域网状态…</div>
    </div>
  </section>

  <!-- ── ③ 同步任务（任务管理独立卡片）──────────────────────-->
  <section class="sec">
    <div class="sec__hd">
      <h2>同步任务</h2>
      <span class="muted small" id="sync-count"></span>
      <span class="spacer"></span>
      <span id="sync-state-pill" class="pill"><i></i><span id="res-state-t">空闲</span></span>
    </div>
    <div class="card">
      <!-- 添加表单常驻（操作入口一直可见，不折叠） -->
      <div class="addrow">
        <label class="fld"><span>小米账号</span>
          <select id="f-sync-account"></select></label>
        <label class="fld"><span>家庭</span>
          <select id="f-sync-household"></select></label>
        <label class="fld"><span>同步周期</span>
          <select id="f-interval-sel" data-role="interval"></select></label>
        <label class="fld addrow__sw"><span>开启同步</span>
          <span class="switch-row" id="polling-row">
            <button type="button" id="sw-polling" class="switch" role="switch" aria-checked="true"><i></i></button>
            <span id="polling-t">开启</span>
          </span></label>
        <button type="button" id="btn-add-sync-ok" class="btn btn--primary">添加任务</button>
      </div>
      <div id="sync-table" class="tscroll"><p class="muted small">读取中…</p></div>
      <div id="res-fail" class="banner banner--warn" hidden></div>
    </div>
  </section>

  <!-- ── ④ 同步结果与局域网检查（两个列表并排页签，点击切换）──────────-->
  <section class="sec">
    <div class="sec__hd">
      <h2>同步结果与局域网检查</h2>
      <div class="seg" role="tablist" aria-label="列表切换">
        <button type="button" id="tab-dev" class="seg__btn seg__btn--on" role="tab" aria-selected="true">同步结果</button>
        <button type="button" id="tab-health" class="seg__btn" role="tab" aria-selected="false">局域网检查</button>
      </div>
    </div>
    <div class="card">
      <!-- 页签一：同步结果列表 -->
      <div id="pane-dev">
        <div class="pane-hd">
          <span class="muted small" id="res-when"></span>
          <span class="spacer"></span>
          <button type="button" id="btn-dev-refresh" class="btn btn--sm">↻ 刷新设备</button>
        </div>
        <div class="filters">
          <label class="fld"><span>所属账号</span>
            <select id="f-dev-account"></select></label>
          <label class="fld"><span>家庭</span>
            <select id="f-dev-household"></select></label>
        </div>
        <div id="res-tiles" class="stats"></div>
        <div class="devgrid">
          <div id="dev-list" class="devlist"><p class="muted small">读取中…</p></div>
          <div id="dev-detail" class="devdetail"><p class="muted small">左侧选择设备查看详情。</p></div>
        </div>
      </div>

      <!-- 页签二：局域网检查列表（2026-11-20 用户要求：与同步结果一致，
           挂账号/家庭筛选框 —— 多账号时按账号过滤） -->
      <div id="pane-health" hidden>
        <div class="pane-hd">
          <span class="muted small" id="health-interval-label"></span>
          <span class="spacer"></span>
          <button type="button" id="btn-health-refresh" class="btn btn--primary btn--sm">立即检查</button>
        </div>
        <div class="filters">
          <label class="fld"><span>所属账号</span>
            <select id="f-health-account"></select></label>
          <label class="fld"><span>家庭</span>
            <select id="f-health-household"></select></label>
        </div>
        <!-- 局域网检查统计条（2026-11-21 用户截图：设备总数 / 在线 / 离线） -->
        <div id="health-tiles" class="stats stats--3"></div>
        <!--
          左列表 + 右详情（2026-11-21 用户：「这部分页面在局域网检查结果列表页面右侧
          应该也需要的」）：同步结果是云端在线控制，局域网检查是**离线局域网触发**，
          两条通道各自要能点开同一台设备看能力。
        -->
        <div class="devgrid" id="health-grid">
          <div id="health-table" class="devlist"><p class="muted small">读取中…</p></div>
          <div id="health-detail" class="devdetail"><p class="muted small">左侧选择设备查看详情。</p></div>
        </div>
      </div>
    </div>
  </section>

</div>

<!-- ⚠ 这一行不能少（2026-11-10 踩过）：
     重写 index.html 时漏掉它，页面会"看起来正常"（HTML/CSS 都在、也没有报错），
     但**脚本从没运行** —— 表现是账号列表永远停在「读取中…」、返回按钮点不动、
     同步区全空，而且控制台一条错误都没有（没有脚本，自然没有报错）。
     闸门 tools/check-ui-handshake.mjs 已加断言钉住"index.html 必须引用 app.js"。 -->
<script src="app.js"></script>
</body>
</html>
